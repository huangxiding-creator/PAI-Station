attributes:
  root:
    id:
      type: string
      required: true
      pattern: ^[a-z][a-z0-9_]*$
    name:
      type: string
      required: true
  library:
    id:
      type: string
      required: true
      pattern: ^[A-Z]{2}$
    name:
      type: string
      required: true
      vocab: library_names
    desc:
      type: string
      required: true
  group:
    id:
      type: string
      required: true
      pattern: ^[A-Z]{2}-[0-9]{2}$
    name:
      type: string
      required: true
      vocab: group_names
    slots:
      type: integer
      required: true
      min: 0
      desc: 蓝图实灌文件槽位数（seeds/0*.json 同名 l2 分组 file_count 之和；未实灌=0）
