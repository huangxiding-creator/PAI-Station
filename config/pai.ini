; PAI-Station 主配置文件（附录 C 字段手册的落地默认值）
; 密钥永不写入本文件：
;   - 智谱 API Key：环境变量 PAI_LLM_KEY（优先），或 config/llm.secret.ini（gitignore）
;   - 企微/Clash 等通道密钥：config/*.secret.ini（gitignore）
; 所有配置均热加载，改完即生效，无需重启。

[llm]
; 智谱免费模型链（链式降级：主模型限流时自动降级）
model = glm-4.7-flash
fallback_models = glm-4-flash,glm-z1-flash
vision_model = glm-4v-flash
; 置信度低于此值时升级到深思考（合法范围 0.5-0.9）
upgrade_confidence = 0.7
; 第 26 章免费极限工程学三字段
ensemble_size = 8
verify_rounds = 2
semantic_cache = 1

[sense]
; 感知源总开关与白名单目录（~ 展开，默认三个用户目录）
enabled = 1
watch_dirs = ~/Documents,~/Desktop,~/Downloads
; 黑名单：窗口标题命中则该截图不入感知
screen_blacklist = 密码,银行,支付,隐私
screenshot_interval = 300

[channels]
; 通道默认全关，opt-in 铁律
wecom = 1
feishu = 0
dingtalk = 0
wechat_mode = vision_readonly

[proactive]
; 主动服务：每日推送上限与勿扰时段
max_push_per_day = 10
quiet_hours = 22:00-07:00
autonomy_level = 1

[privacy]
; 三级隐私档位：L0 全本地 / L1 脱敏上云 / L2 全上云
level = 1
audit_retention_days = 90
wechat_vision = 0

[learn]
; 双环学习：重大变更须用户确认（安全默认不可低于 1）
double_loop_confirm = 1
distill_schedule = daily
explore_rate = 0.1

[wow]
; 第 25 章三感产品宪章（全部计入 max_push_per_day 预算）
wow_first_run = 1
singularity_announce = 1
zero_bill_monthly = 1
