; PAI-Station 主配置（附录 C.1：27 字段 + C.9 [wow]）
; 密钥永不写入本文件：
;   - 智谱 API Key：环境变量 PAI_LLM_KEY（优先），或 [llm].api_key，或 config/llm.secret.ini（gitignore）
;   - 通道凭据：config/*.secret.ini（gitignore）
; 启动全量校验，非法值中文报错并拒绝启动（不带病运行，附录 C.4）。

[llm]
; 推理链（V3.0 勘误后现行免费族谱，附录 E.1）
fast_model = glm-4-flash-250414
deep_model = glm-4.7-flash
vision_model = glm-4.6v-flash
long_model = glm-4.7-flash
; 系统 1→2 升级阈值（越低越保守）
upgrade_confidence = 0.7
; 第 26 章免费极限工程学三兵器（限流时 ensemble 自动阶梯降至 4→1）
ensemble_size = 8
verify_rounds = 2
semantic_cache = 1

[sense]
; 感知白名单（~ 展开；路径不存在启动即报错）
watch_dirs = ~/Documents,~/Desktop,~/Downloads
ignore_patterns = *.tmp,~$*,.git,node_modules
screen_interval_sec = 600
screen_blacklist = 密码管理器,银行,支付,登录
fg_poll_sec = 300
deepwork_apps = WINWORD.EXE,idea64.exe,Code.exe,wps.exe
; 最敏感源默认关
clipboard_enabled = 0

[channels]
; 通道默认 opt-in（企微起步）
feishu_enabled = 0
dingtalk_enabled = 0
wecom_enabled = 1
; 代码层硬编码仅允许 vision_readonly，改其他值直接拒绝（防篡改）
wechat_mode = vision_readonly
notify_webhook =

[proactive]
max_push_per_day = 2
drawer_retention_days = 7
quiet_hours = 22:00-07:00
explore_rate = 0.1

[privacy]
; 留空 = %LOCALAPPDATA%\PAI-Station
data_dir =
export_on_exit = 0
never_send = 原始截图,凭据类文件,身份证,银行卡

[learn]
pdca_time = 02:00
distill_min_samples = 5
; 安全默认不可低于 1（双环改动必须用户确认）
double_loop_confirm = 1

[wow]
; 第 25 章三感宪章（全部计入 max_push_per_day，绝不另开通知通道）
wow_first_run = 1
singularity_announce = 1
zero_bill_monthly = 1
