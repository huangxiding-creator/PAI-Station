[jev]
# Jev 判断层总开关：off 后所有接线点静默回退原行为
enabled = 1
# 全局默认引擎（未命名位/未过门位用）：typesafe=Jev 云端付费
engine = typesafe

[engines]
# P1 渐进位（9-24 平价门 v2 三门全 PASS 后切，措辞=训练措辞逐字才切）：
# taskcards=E2 门过（recall1.0/fp0.0）/ golden=E3 门过（捕获4/5+sep0.53）
taskcards = laya
golden = laya

[shadow]
# 双轨影子：主引擎≠laya 的位答完后单发 laya（免费）记一致性/延迟——
# 未过门位（intent 快路径/J1 信源筛/RF 三腿）攒 agree 数据过门再切
engine = laya
sample = 1.0
