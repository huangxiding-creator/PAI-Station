<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#333;display:flex;justify-content:center;padding:20px;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
.phone{width:390px;background:#f8f5ed;border-radius:24px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.hero{background:linear-gradient(180deg,#050e1c,#071a39 60%,#0d2449);padding:60px 24px 26px;position:relative;
background-image:linear-gradient(rgba(101,161,251,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(101,161,251,.14) 1px,transparent 1px);background-size:80px 80px}
.kicker{font-size:11px;letter-spacing:4px;color:#9cadc9;margin-bottom:10px}
.title{font-size:34px;font-weight:900;color:#edf4ff;letter-spacing:2px}
/* v0.7.7 hero-ai */
.hero-ai{display:inline-flex;align-items:center;gap:7px;margin:10px 0 6px;padding:6px 10px;background:rgba(5,14,28,.82);border:1px solid rgba(255,148,50,.9);border-radius:5px}
.hero-ai-badge{flex-shrink:0;font-size:13.5px;font-weight:800;letter-spacing:1px;color:#071a39;background:linear-gradient(180deg,#ffd9a8,#ff9432);border-radius:4px;padding:3px 8px}
.hero-ai-text{font-size:14px;font-weight:700;letter-spacing:.5px;color:#fff;text-shadow:0 1px 4px rgba(4,12,26,.55)}
.sub{font-size:11.5px;color:#bac8de;line-height:1.7;margin-top:8px}
.ticket{margin-top:16px;background:rgba(4,12,26,.72);border-radius:8px;padding:12px 14px;color:#edf4ff;font-size:12px}
.card{margin:14px 12px;background:#fdfbf7;border-radius:10px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ck{font-size:10px;letter-spacing:2px;color:#798496}.ta{margin-top:10px;font-size:13px;color:#9aa5b8;border:1px dashed #ddd6c6;border-radius:6px;padding:14px 10px;line-height:1.6}
.btn{margin-top:10px;display:flex;gap:8px}
.b1,.b2{flex:1;text-align:center;padding:10px 0;border-radius:6px;font-size:13px;font-weight:600}
.b1{background:#fdfbf7;border:1px solid #ddd6c6;color:#384457}.b2{background:#2164ca;color:#fff}
/* 旧版对照 */
.old-flag{margin:11px 12px 0;display:flex;align-items:center;gap:8px;background:rgba(255,150,51,.10);border:1px solid rgba(255,150,51,.55);border-left:4px solid #ff9633;border-radius:4px;padding:10px 11px}
.old-badge{font-size:10.5px;font-weight:800;color:#071a39;background:linear-gradient(180deg,#ffba7a,#ff9633);border-radius:3px;padding:3px 6px}
.old-text{font-size:12.5px;font-weight:600;color:#1a2435}
</style></head><body><div class="phone">
<div class="hero">
<div class="kicker">GENERAL CONTRACTOR · AI ADVISOR</div>
<div class="title">总包AI顾问</div>
<div class="hero-ai"><span class="hero-ai-badge">AI生成</span><span class="hero-ai-text">本服务内容由人工智能（AI）生成 · 仅供参考</span></div>
<div class="sub">AI 检索行业知识库生成的专业参考 · 总包人的随身工程顾问 / 招投标 / 签约 / 风险 / 造价争议 / 审计 / 合同实务</div>
<div class="ticket">今日可咨询 5 次 · 免费 3 次 · 互动加赠 2 次</div>
</div>
<div class="card"><div class="ck">咨询问题 · CONSULTATION</div>
<div class="ta">例如：EPC 固定总价合同下材料暴涨，能申请调价吗？依据和操作步骤是什么？</div>
<div class="btn"><div class="b1">AI优化提问</div><div class="b2">立即咨询</div></div></div>
<div class="old-flag"><span class="old-badge">AI生成</span><span class="old-text">本服务内容由人工智能（AI）生成，仅供参考，不构成专业意见</span></div>
<div style="height:60px"></div>
</div></body></html>
