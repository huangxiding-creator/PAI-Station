<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=Edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="favicon.ico">
	<script src="chart.js"></script>
	<title></title>
</head>
<style>
    #myChartCon {
        width: 900px;
        height: 450px;
    }
</style>
<body>
<div id="myChartCon">
<canvas id="myChart"></canvas>
</div>
<script>
var ctx = document.getElementById("myChart").getContext('2d');
var myChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: '',
            data: [],
            backgroundColor: [
                'rgba(255, 99, 132, 0.2)'
            ],
            borderColor: [
                'rgba(255,99,132,1)'
            ],
            borderWidth: 1
        }]
    },
    options: {
        legend: { display: false},
        scales: {
            yAxes: [{
                ticks: {
                    beginAtZero:false
                }
            }]
        }
    }
});
</script>
<script>
    function setData(labels, data, flag) {
        var setData = JSON.parse(data);
        var setLabel = JSON.parse(labels);
        myChart.data.labels = setLabel;
        myChart.data.datasets[0].data = setData;
        //alert(myChart.data.labels)
        //myChart.data.labels = ["2020-06-25", "2020-06-25", "2020-06-25", "2020-06-26"];
        //myChart.data.datasets[0].label = null;
        //alert(myChart.data.datasets[0].label)
        myChart.update();
    }
    //window.addEventListener("load", setData, false);
</script>
</body>
