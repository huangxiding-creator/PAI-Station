	<script type="text/javascript">
		var WordConvert = {
		  //单个word转换
		  ConvertToHtml:async function(id,wordSrc,title,htmlPath, flag) {
			function transformParagraph(paragraph) { 
				let styleName = ""; 
				if (paragraph.alignment === "center") { 
					styleName = "text-center"; 
				} 
				else if (paragraph.alignment === "right") { 
					styleName = "text-right"; 
				} 
				return { ...paragraph, styleName }; 
			} 
			
			var base64String = window.JsReadFileBase64(wordSrc)
			
			function base64ToArrayBuffer(base64) {
				// 解码 Base64 字符串为二进制字符串
				const binaryString = atob(base64);
				
				// 创建一个 Uint8Array，用于存储解码后的字节
				const len = binaryString.length;
				const bytes = new Uint8Array(len);
				
				// 将每个字符转换为字节
				for (let i = 0; i < len; i++) {
					bytes[i] = binaryString.charCodeAt(i);
				}
				
				// 创建并返回 ArrayBuffer
				return bytes.buffer;
			}
            
			try {
				// 获取 ArrayBuffer
				const arrayBuffer = base64ToArrayBuffer(base64String);
				const options = { transformDocument: mammoth.transforms.paragraph(transformParagraph) }; 
				const result = await mammoth.convertToHtml({arrayBuffer: arrayBuffer}, options);
				window.JsWriteLocalFile(htmlPath,result.value);
				window.JsConvertWordToHtml(id,wordSrc,title,htmlPath,flag);				
			} catch (error) {
			  window.JsConvertWordToHtml(id,wordSrc,title,'',flag)
			}
		  },
		  //多个word转换
	      MutiConvertToHtml:async function(convertInfo, flag) {
			try {
				  const arrayObject = JSON.parse(convertInfo);
				  
				  // 使用Promise.all并发处理
				  const promises = arrayObject.map(item => 
					this.ConvertToHtml(item.id, item.fileName, item.title, item.htmlPath, flag)
				  );

				  // 等待所有转换完成
				  await Promise.all(promises);
				  console.log('所有文件已转换完成');
				  
				} catch (error) {
				  console.error('JSON 解析错误:', error.message);
				}
			}
		}		
	  </script>

<script type="text/javascript">


    function getStrCount(scrstr,armstr) { //scrstr 源字符串 armstr 特殊字符
     var count=0;
     while(scrstr.indexOf(armstr) != -1 ) {
        scrstr = scrstr.replace(armstr,"")
        count++;    
     }
     return count;
}
    //实例化编辑器
    //建议使用工厂方法getEditor创建和引用编辑器实例，如果在某个闭包下引用该编辑器，直接调用UE.getEditor('editor')就能拿到相关的实例
    var ue = UE.getEditor('editor', {
        toolbars:[['Bold', 'blockquote', 'horizontal', '|', 'forecolor', 'backcolor', 'fontsize', 'justifyleft', 'justifycenter', 'justifyright', '|', 'searchreplace', 'removeformat', 'Undo', 'redo', 'source']],
        //关闭字数统计
        wordCount:true,
        //focus时自动清空初始化时的内容
        autoClearinitialContent:true,
        //关闭elementPath
        elementPathEnabled:false,
        enableAutoSave:false,
        imagePopup:false,
        enableContextMenu:true,
        fullscreen:true,
    });
	
    var WEMediaEdit = {
        init: function () {
            this.content = '';       
            this.articlId = '';
            this.isSendContentChange = false;
            var s = this;
            UE.getEditor('editor').addListener('contentChange', function () {
			
			//alert("setArticleContent2");
				var count = UE.getEditor('editor').getContentLength(true);
				var pureContent = UE.getEditor('editor').getContentTxt();
				//document.getElementById('articleCount').innerHTML = pureContent.length;
				var content = UE.getEditor('editor').getContent();
				var contentBack = content;
				var imgCount = getStrCount(contentBack, '<img');
				//alert("setArticleContent3");
				//document.getElementById("edui1_wordcount").innerHTML = '字数 ' + pureContent.length + '&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;' + "图片 " + imgCount;
				//alert("setArticleContent4");
                if (content === s.content) return;
                s.content = content;
                if (s.isSendContentChange) return;
                s.isSendContentChange = true;
                window.JsContentChange(s.articleId, s.content);
            })
        },
        setArticleId: function(id) {
            this.articleId = id;           
        },
        setArticleContent: function(content) {
            UE.getEditor('editor').setContent(content, false);
        },
        setFocus: function () {
            UE.getEditor('editor').focus();
        },
        insertImg: function (imgUrl) {
            var data = {};
            var imgTagHead = '<p><img alt="" src="';
            var imgTagTail = '"/></p>';
            var code = imgTagHead + imgUrl + imgTagTail;
            UE.getEditor('editor').execCommand('inserthtml', code);
        },
        insertMultImg: function(imgData) {
            var data = JSON.parse(imgData);
            UE.getEditor('editor').execCommand('insertimage', data);
        },
        insertLink: function (linkData) {
            var data = JSON.parse(linkData);
            UE.getEditor('editor').execCommand('link', data);
        },
        getArticleContent: function(flag) {
            var content = UE.getEditor('editor').getContent();
            var pureContent = UE.getEditor('editor').getContentTxt();
            window.JsGetArticleContent(this.articleId, content, pureContent, flag);
        },
        setSaved: function () {
            this.isSendContentChange = false;
        }
    }

    WEMediaEdit.init();
    WEMediaEdit.setArticleContent('<pre>&nbsp;{=&nbsp;&nbsp;&nbsp;&nbsp;},</pre><p><br/></p>')

    function isFocus(e){
        alert(UE.getEditor('editor').isFocus());
        UE.dom.domUtils.preventDefault(e)
    }
    function setblur(e){
        UE.getEditor('editor').blur();
        UE.dom.domUtils.preventDefault(e)
    }
    function insertHtml() {
        var value = prompt('插入html代码', '');
        UE.getEditor('editor').execCommand('insertHtml', value)
    }
    function createEditor() {
        enableBtn();
        UE.getEditor('editor');
    }
    function getAllHtml() {

    }
    function getContent() {
        var arr = [];
        arr.push("使用editor.getContent()方法可以获得编辑器的内容");
        arr.push("内容为：");
        arr.push(UE.getEditor('editor').getContent());
        alert(arr.join("\n"));
    }
    function getPlainTxt() {

        arr.push("内容为：");
        arr.push(UE.getEditor('editor').getPlainTxt());
        alert(arr.join('\n'))
    }
    function setContent(isAppendTo) {
        var arr = [];
        arr.push("使用editor.setContent('欢迎使用ueditor')方法可以设置编辑器的内容");
        UE.getEditor('editor').setContent('欢迎使用ueditor', isAppendTo);
        alert(arr.join("\n"));
    }
    function setDisabled() {
        UE.getEditor('editor').setDisabled('fullscreen');
        disableBtn("enable");
    }

    function setEnabled() {
        UE.getEditor('editor').setEnabled();
        enableBtn();
    }

    function getText() {
        //当你点击按钮时编辑区域已经失去了焦点，如果直接用getText将不会得到内容，所以要在选回来，然后取得内容
        var range = UE.getEditor('editor').selection.getRange();
        range.select();
        var txt = UE.getEditor('editor').selection.getText();
        alert(txt)
    }

    function getContentTxt() {
        var arr = [];
        arr.push("使用editor.getContentTxt()方法可以获得编辑器的纯文本内容");
        arr.push("编辑器的纯文本内容为：");
        arr.push(UE.getEditor('editor').getContentTxt());
        alert(arr.join("\n"));
    }
    function hasContent() {
        var arr = [];
        arr.push("使用editor.hasContents()方法判断编辑器里是否有内容");
        arr.push("判断结果为：");
        arr.push(UE.getEditor('editor').hasContents());
        alert(arr.join("\n"));
    }
    function setFocus() {
        UE.getEditor('editor').focus();
    }
    function deleteEditor() {
        disableBtn();
        UE.getEditor('editor').destroy();
    }
    function disableBtn(str) {
        var div = document.getElementById('btns');
        var btns = UE.dom.domUtils.getElementsByTagName(div, "button");
        for (var i = 0, btn; btn = btns[i++];) {
            if (btn.id == str) {
                UE.dom.domUtils.removeAttributes(btn, ["disabled"]);
            } else {
                btn.setAttribute("disabled", "true");
            }
        }
    }
    function enableBtn() {
        var div = document.getElementById('btns');
        var btns = UE.dom.domUtils.getElementsByTagName(div, "button");
        for (var i = 0, btn; btn = btns[i++];) {
            UE.dom.domUtils.removeAttributes(btn, ["disabled"]);
        }
    }

    function getLocalData () {
        alert(UE.getEditor('editor').execCommand( "getlocaldata" ));
    }

    function clearLocalData () {
        UE.getEditor('editor').execCommand( "clearlocaldata" );
