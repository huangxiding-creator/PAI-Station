<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
        "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <title>平台编辑器</title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
    <script type="text/javascript" charset="utf-8" src="ueditor/ueditor.config.js"></script>
    <script type="text/javascript" charset="utf-8" src="ueditor/editor_api2.js"> </script>
    <!--这里加载的语言文件会覆盖你在配置项目里添加的语言类型，比如你在配置项目里配置的是英文，这里加载的中文，那最后就是中文-->
    <script type="text/javascript" charset="utf-8" src="ueditor/lang/zh-cn/zh-cn.js"></script>
    <script type="text/javascript" charset="utf-8" src="H1Button.js"></script>
    <script type="text/javascript" charset="utf-8" src="OrderList.js"></script>
    <script type="text/javascript" charset="utf-8" src="UnOrderList.js"></script>
    <script type="text/javascript" charset="utf-8" src="InsertImg.js"></script>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
            border: 0;
        }
        #edui1_bottombar {
            display: none;
        }
        .edui-toolbar {
        	display: none;
        }
        .edui-editor-toolbarboxinner {
        	display: none;
        }
        .edui-editor-toolbarboxouter {
        	display: none;
        }
        ::-webkit-scrollbar  
        {  
            width: 6px;  
            height: 6px;  
            background-color: #E3E6EB;  
        } 

        ::-webkit-scrollbar-track  
        {  
            border-radius: 20px;  
            background-color: #E3E6EB;  
        }

        ::-webkit-scrollbar-thumb  
        {  
            border-radius: 20px;  
            background-color: #A3A9B4;  
        }     
    </style>
</head>

<body>
<div>
    <script id="editor" type="text/plain"></script>
</div>


<script type="text/javascript">
    //实例化编辑器
    //建议使用工厂方法getEditor创建和引用编辑器实例，如果在某个闭包下引用该编辑器，直接调用UE.getEditor('editor')就能拿到相关的实例
    //UE.delEditor('editor');
    var ue = UE.getEditor('editor', {
        toolbars:['source'],
        //关闭字数统计
        wordCount:false,
        //focus时自动清空初始化时的内容
        autoClearinitialContent:true,
        //关闭elementPath
        elementPathEnabled:false,
        enableAutoSave:false,
        imagePopup:false,
        enableContextMenu:true,
        fullscreen:true,
    });

    var WEMediaEdit = {
		init: function () {
			this.content = '';       
			//this.isSendContentChange = false;
			UE.getEditor('editor').addListener('contentChange', function () {
				//if (this.isSendContentChange) return;
				var content = UE.getEditor('editor').getContent();
				if (content === this.content) return;
				this.content = content;
				//this.isSendContentChange = true;
				window.JsRiskContentChange(this.content);
			})
		},

		setArticle: function (article) {
			this.content = article;
			var s = UE.getEditor('editor');
			s.setContent(article, false);
		},
		getArticle: function (flag) {
			if (!flag)
				flag = '';
			var content = UE.getEditor('editor').getContent();
			var pureContent = UE.getEditor('editor').getContentTxt();
			window.JsGetRiskArticle(content, pureContent, flag);
		}
	}
    WEMediaEdit.init();

    function disable() {
    	UE.getEditor('editor').setDisabled();
    }

    function isFocus(e){
        alert(UE.getEditor('editor').isFocus());
        UE.dom.domUtils.preventDefault(e)
    }
    function setblur(e){
        UE.getEditor('editor').blur();
        UE.dom.domUtils.preventDefault(e)
    }
    function insertHtml() {
        var value = prompt('插入html代码', '');
        UE.getEditor('editor').execCommand('insertHtml', value)
    }
    function createEditor() {
        enableBtn();
        UE.getEditor('editor');
    }
    function getAllHtml() {
        alert(UE.getEditor('editor').getAllHtml())
    }
    function getContent() {
        var arr = [];
        arr.push("使用editor.getContent()方法可以获得编辑器的内容");
        arr.push("内容为：");
        arr.push(UE.getEditor('editor').getContent());
        alert(arr.join("\n"));
    }
    function getPlainTxt() {
        var arr = [];
        arr.push("使用editor.getPlainTxt()方法可以获得编辑器的带格式的纯文本内容");
        arr.push("内容为：");
        arr.push(UE.getEditor('editor').getPlainTxt());
        alert(arr.join('\n'))
    }
    function setContent(isAppendTo) {
        var arr = [];
        arr.push("使用editor.setContent('欢迎使用ueditor')方法可以设置编辑器的内容");
        UE.getEditor('editor').setContent('欢迎使用ueditor', isAppendTo);
        alert(arr.join("\n"));
    }
    function setDisabled() {
        UE.getEditor('editor').setDisabled('fullscreen');
        disableBtn("enable");
    }

    function setEnabled() {
        UE.getEditor('editor').setEnabled();
        enableBtn();
    }

    function getText() {
        //当你点击按钮时编辑区域已经失去了焦点，如果直接用getText将不会得到内容，所以要在选回来，然后取得内容
        var range = UE.getEditor('editor').selection.getRange();
        range.select();
        var txt = UE.getEditor('editor').selection.getText();
        alert(txt)
    }

    function getContentTxt() {
        var arr = [];
        arr.push("使用editor.getContentTxt()方法可以获得编辑器的纯文本内容");
        arr.push("编辑器的纯文本内容为：");
        arr.push(UE.getEditor('editor').getContentTxt());
        alert(arr.join("\n"));
    }
    function hasContent() {
        var arr = [];
        arr.push("使用editor.hasContents()方法判断编辑器里是否有内容");
        arr.push("判断结果为：");
        arr.push(UE.getEditor('editor').hasContents());
        alert(arr.join("\n"));
    }
    function setFocus() {
        UE.getEditor('editor').focus();
    }
    function deleteEditor() {
        disableBtn();
        UE.getEditor('editor').destroy();
    }
    function disableBtn(str) {
        var div = document.getElementById('btns');
        var btns = UE.dom.domUtils.getElementsByTagName(div, "button");
        for (var i = 0, btn; btn = btns[i++];) {
            if (btn.id == str) {
                UE.dom.domUtils.removeAttributes(btn, ["disabled"]);
            } else {
                btn.setAttribute("disabled", "true");
            }
        }
    }
    function enableBtn() {
        var div = document.getElementById('btns');
        var btns = UE.dom.domUtils.getElementsByTagName(div, "button");
        for (var i = 0, btn; btn = btns[i++];) {
            UE.dom.domUtils.removeAttributes(btn, ["disabled"]);
        }
    }

    function getLocalData () {
        alert(UE.getEditor('editor').execCommand( "getlocaldata" ));
    }

    function clearLocalData () {
        UE.getEditor('editor').execCommand( "clearlocaldata" );
        alert("已清空草稿箱")
    }
</script>
</body>
</html>
