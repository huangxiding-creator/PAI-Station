[settings]
# 登录页面URL
login_url = https://manus.im/login?type=signIn

# 下载文件夹
download_folder = downloads

# 最多下载文件数量
max_download_files = 3

# 最少成果文件数量
min_result_files = 25

# 日志文件名
log_file = manus_automation.log

# 账号列表文件名
account_file =账号列表 - 调试.txt

# 需要刷新页面的提示文本
refresh_trigger_text = 双倍积分促销！

[wait_times]
# 等待时间配置（秒）
page_load = 3
after_click = 2
between_accounts = 5
download_interval = 2

[prompts]
# 自定义提示词
continue_prompt = 遇到需要我回复时，请自主决策采用你认为最佳的方案继续完成工作。遇到权限限制无法直接获取信息的情况时，通过公开渠道间接查找相关信息。经检查，你并没有严格按照我的要求进行工作。重申成果硬性要求：1）报告结构单独存为”报告结构.md"文件。报告核心内容不少于15章，章节内容不可重复，每章单独存储为一个Markdown文件，不要出现多个版本。2）报告总字数达到30万个汉字，不可出现敏感字眼，不可存在侵犯个人隐私的情况。3）将你详细的推理和思考过程写到相应的内容里，尽可能采用表格形式表达内容。4）各章节内容撰写完成后，按照”报告结构.md"整合为一份完整的Markdown格式成果，章节内容有多个版本时，采用字数多的。最终无损合并提交高端出版物排版级别的docx格式成果。
 
improve_prompt = 经检查，你并没有严格按照我的要求交付高质量的成果，请基于当前成果继续提升成果质量严格交付最高质量的出版物级排版docx格式研究报告。请按如下要求逐条检查既有成果并优化提升：（1）报告结构：报告结构单独存为”报告结构.md"文件。报告结构必须包含：严正声明、≥3000字内容摘要、研究方法、报告价值、≥5000字推荐序、≥15章核心内容、术语表。不要在章节里面有参考文献相关内容。章为一级标题，报告结构禁止出现“部分”层级，总章序号连续、规范，避免自动序号混乱。（2）结构深度：各章核心内容深入到4级标题，章节末尾需有小结。 章节标题使用专业词汇并准确表达洞察性结论，看到结构即产生“愿付100万元购买”的冲击感。（3）语言风格：专业、严谨、洞察、客观，统一文风，彻底摒弃“AI味”，符合工程建设术语规范，适当采用口语的表达方式，增强人情味。 （4）核心内容：每个段落不少于200字，禁止出现关键词+一句话的碎片段落。 （5）真实可靠性：所有基础数据与事实必须真实、可靠，来源明确，关键信息须通过三重交叉验证，并标明出处。所有观点、结论须逻辑严密，经数据源/逻辑链/现实案例三重验证，将详细的推理和思考过程写到相应的内容里；尽量使用表格呈现。  杜绝任何虚构、待补充、预计字数等字样；穷尽方法仍无法获取的数据即删除并调整结构，不得留空。（6）完整性：如存在还需要补充内容的情况，请自行补充内容。如无法补充需补充的内容，直接删除该部分内容，不要留有待补充的说明文字。（7）脱敏处理：全文不得出现“竞争对手”“情报”“专家访谈”“调研”“国务院”“Manus AI”等敏感字眼，不得侵犯个人隐私。（8） 中间成果存储：将各章节多次生成的内容整合合并成、单独存储为一份Markdown文件。章节内容不可重复，有更新修改时直接在之前版本基础上进行，不要另外设立新的章节。如有重复的章节内容，请采用字数最多的版本，删除其他所有版本。（9）最终成果：完成所有章节内容撰写后，按照”报告结构.md"整合为一份完整的Markdown格式成果。最终无损合并并转制为docx出版物级排版成果。成果总字数30万汉字以上。（10）最终质量检查：全面对照最初我发给你的任务要求，发现重复、遗漏、排版、总字数不达标问题时，自动修正、补充完善每章Markdown文件，更新最终docx出版物级排版成果。修正、补充、更新时直接更新原文件，不要出现多个版本。（11）上下文继承与自动续航：会话中断前自动保存状态、压缩重构并重启，确保流程不中断；沙盒重置或文件丢失时自动重新生成。全流程自动化决策：故障/错误自行修正；需确认事项自主采用最优解，无需人工确认。

