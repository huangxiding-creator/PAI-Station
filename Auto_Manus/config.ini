organize_prompt = 请继续提升成果质量。（1）最终成果章节内容不可重复。如有重复的章节内容，请采用字数最多的版本，删除其他所有版本。（2）全文不得出现“竞争对手”“情报”“专家访谈”“调研”“国务院”“Manus AI”等敏感字眼，不得侵犯个人隐私。（3）最终质量检查：全面对照最初我发给你的任务要求，发现重复、遗漏、排版、总字数不达标问题时，自动修正、补充完善每章Markdown文件，更新最终docx出版物级排版成果。修正、补充、更新时直接更新原文件，不要出现多个版本。（4）全流程自动化决策：故障/错误自行修正；需确认事项自主采用最优解，无需人工确认。


