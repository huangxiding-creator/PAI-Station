[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paistation"
version = "1.0.0"
description = "PAI-Station：7×24 常驻 Windows 的个人超级 AI 工作站"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PAI-Station" }]
dependencies = [
    "watchdog>=4.0",
    "APScheduler>=3.10",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
tray = [
    "pystray>=0.19",
    "Pillow>=10.0",
]
anki = [
    "genanki>=0.13",
]

[project.scripts]
paistation = "paistation.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# scripts/ 统一采用 sys.path 引导后 import 本仓库包的直跑模式
"scripts/*" = ["E402"]
