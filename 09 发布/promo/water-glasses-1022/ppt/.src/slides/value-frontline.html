<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="deck.css">
<body>
<section class="slide" id="value-frontline" style="padding:0.85in 0.9in;">
  <div class="kicker">用户价值 · 一线</div>
  <div class="slide-title" style="margin-top:0.16in; font-size:36pt;">每一天，看得见的差别</div>
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:0.5in; margin-top:0.62in;">
    <div>
      <div class="bignum" style="font-size:64pt;">96.5<span class="unit">%</span></div>
      <div class="bignum-label">工程高频场景识别准确率<br>误报 &lt;5% · 漏报 &lt;3%（人工漏报约 15–20%）</div>
      <div class="bignum-src">双层架构视觉复核 · 官网实测发布值</div>
    </div>
    <div>
      <div class="bignum" style="font-size:64pt;">1.5<span class="unit">h</span></div>
      <div class="bignum-label">单次巡检时长上限<br>原 4–6 小时，发现率提升超 200%</div>
      <div class="bignum-src">边走边识别 · 官网实测发布值</div>
    </div>
    <div>
      <div class="bignum" style="font-size:64pt;">3<span class="unit">min</span></div>
      <div class="bignum-label">从发现到企微推送<br>处置时效由 48 小时压缩至 4 小时</div>
      <div class="bignum-src">闭环链路实测 · 官网实测发布值</div>
    </div>
  </div>
  <div class="rule" style="margin-top:0.72in;"></div>
  <div style="font-size:15pt; color:var(--muted); margin-top:0.24in;">
    会用手机，就会用它——全程语音指令，上手零门槛。
  </div>
</section>
</body></html>
