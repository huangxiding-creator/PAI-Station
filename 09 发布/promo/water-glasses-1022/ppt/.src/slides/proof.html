<html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="deck.css">

<section class="slide" id="proof">

        <div style="font-size:15pt; line-height:1.65;">

        </div>
        <div style="font-size:12.5pt; color:var(--muted);">数值 ±σ 可追溯；判定不过夜，推送不过 3 分钟。</div>
      </div>
    </div>
    <div class="img-col">
      <div class="frame" style="height:5.95in;"><img src="media/hud.png" alt="第一视角测距判定界面"></div>

  </div>
