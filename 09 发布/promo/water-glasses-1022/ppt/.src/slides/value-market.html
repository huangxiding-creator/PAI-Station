<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="deck.css">
<body>
<section class="slide" id="value-market">
  <div class="split">
    <div class="text-col" style="padding-right:0.4in;">
      <div class="kicker">市场价值</div>
      <div class="slide-title" style="margin-top:0.18in; font-size:34pt;">成本降一个量级，<br>市场放大一个量级</div>
      <div style="margin-top:0.34in; display:flex; flex-direction:column; gap:0.22in;">
        <div>
          <div style="font-size:16.5pt; font-weight:600;">单台 <span class="num">3,299</span> 元（验收实价）＋软件年费约 <span class="num">500</span> 元</div>
          <div style="font-size:13pt; color:var(--muted); margin-top:0.04in;">对比传统视觉方案约 <span class="num">16,000</span> 元/场景、管理平台数十万/套——降幅约 80%，且新增场景只调提示词</div>
        </div>
        <div>
          <div style="font-size:16.5pt; font-weight:600;">判定内核与行业无关</div>
          <div style="font-size:13pt; color:var(--muted); margin-top:0.04in;">水利先行验证，电力、建筑、市政、核电等 12 个高危行业快速复制</div>
        </div>
        <div>
          <div style="font-size:16.5pt; font-weight:600;">典型项目 ROI <span class="num">298%</span>（测算）</div>
          <div style="font-size:13pt; color:var(--muted); margin-top:0.04in;">年安全预算 50 万元级项目：年节约约 <span class="num">48.67</span> 万元，3 年累计约 <span class="num">146</span> 万元</div>
        </div>
      </div>
    </div>
    <div class="img-col" style="display:flex; align-items:center;">
      <div class="frame" style="height:4.6in; background:var(--paper);"><img src="media/chart_cost.png" alt="单台成本对比"></div>
    </div>
  </div>
</section>
</body></html>
