<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="deck.css">
<body>
<section class="slide" id="pain">
  <div class="split">
    <div class="text-col">
      <div class="kicker">现场的真实处境</div>
      <div class="slide-title" style="margin-top:0.12in;">安全检查，还在靠腿、靠眼、靠经验</div>
      <div style="margin-top:0.30in; display:flex; flex-direction:column; gap:0.155in;">
        <div>
          <div style="font-size:18pt; font-weight:600;">一次巡检 4–6 小时</div>
          <div style="font-size:14pt; color:var(--muted); margin-top:0.03in;">走到哪查到哪，项目越大，漏洞越多</div>
        </div>
        <div>
          <div style="font-size:18pt; font-weight:600;">隐患判定凭经验</div>
          <div style="font-size:14pt; color:var(--muted); margin-top:0.03in;">「差不多」三个字，就是风险的入口</div>
        </div>
        <div>
          <div style="font-size:18pt; font-weight:600;">记录靠纸笔、事后补</div>
          <div style="font-size:14pt; color:var(--muted); margin-top:0.03in;">追责的时候，说不清当时看见了什么</div>
        </div>
        <div>
          <div style="font-size:18pt; font-weight:600;">2 米阈值，肉眼估不出准数</div>
          <div style="font-size:14pt; color:var(--muted); margin-top:0.03in;">高处作业该不该报，全凭一双眼</div>
        </div>
      </div>
      <div class="rule" style="margin:0.26in 0 0.18in;"></div>
      <div style="font-size:15.5pt; color:var(--accent); font-weight:600;">查出问题是运气，查不出是隐患</div>
    </div>
    <div class="img-col">
      <div class="frame"><img src="media/scene.jpg" alt="水利施工现场" style="filter:brightness(.62) saturate(.85);"></div>
    </div>
  </div>
</section>
</body></html>
