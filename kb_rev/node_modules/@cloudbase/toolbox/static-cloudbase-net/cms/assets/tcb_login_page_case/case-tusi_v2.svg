<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">吐司应用生成平台</title>
  <desc id="desc">从灵感生成应用、配置独立环境到上线的产品界面，背景补充多租户应用业务属性。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1E7"/>
      <stop offset="1" stop-color="#FFF9F2"/>
    </linearGradient>
    <linearGradient id="orange" x1="214" y1="139" x2="732" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8C54"/>
      <stop offset="1" stop-color="#FFC066"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="790" cy="72" r="170" fill="#FFD6B5" fill-opacity="0.55"/>
  <circle cx="122" cy="467" r="160" fill="#FFE5CC" fill-opacity="0.75"/>

  <!-- 仅补充背景业务语义：不同团队在独立环境中生成、发布应用，不改变原有主体卡片。 -->
  <g opacity="0.32" fill="none" stroke="#D68861" stroke-width="2">
    <path d="M42 220H101L129 248"/>
    <path d="M831 168H903L924 192"/>
    <path d="M824 360H888L914 337"/>
    <rect x="38" y="176" width="70" height="43" rx="7"/>
    <rect x="852" y="122" width="64" height="43" rx="7"/>
    <rect x="850" y="363" width="70" height="43" rx="7"/>
    <path d="M53 191H93M53 204H81M866 138H901M866 151H889M865 379H904M865 392H890" stroke-linecap="round"/>
  </g>
  <g opacity="0.34" fill="#E49A6C">
    <circle cx="129" cy="248" r="5"/><circle cx="831" cy="168" r="5"/><circle cx="824" cy="360" r="5"/>
    <circle cx="52" cy="260" r="10"/><circle cx="82" cy="260" r="10"/><circle cx="112" cy="260" r="10"/>
  </g>

  <rect x="168" y="116" width="624" height="308" rx="18" fill="white" stroke="#F2D2BB" stroke-width="2"/>
  <rect x="168" y="116" width="624" height="50" rx="18" fill="url(#orange)"/>
  <rect x="168" y="150" width="624" height="16" fill="url(#orange)"/>
  <circle cx="200" cy="141" r="7" fill="white" fill-opacity="0.8"/>
  <circle cx="222" cy="141" r="7" fill="white" fill-opacity="0.55"/>
  <text x="252" y="148" fill="white" font-size="18" font-weight="600" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">吐司 · 应用生成平台</text>
  <rect x="202" y="200" width="356" height="170" rx="14" fill="#FFF4EC"/>
  <text x="230" y="241" fill="#803D20" font-size="20" font-weight="600" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">一句灵感，生成一个应用</text>
  <rect x="230" y="270" width="238" height="18" rx="5" fill="#F5C5A7"/>
  <rect x="230" y="304" width="190" height="18" rx="5" fill="#F9DCC9"/>
