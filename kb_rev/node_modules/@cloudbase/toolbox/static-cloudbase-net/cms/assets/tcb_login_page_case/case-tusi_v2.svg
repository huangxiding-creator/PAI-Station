  <text x="673" y="333" text-anchor="middle" fill="#8F512E" font-size="16" font-weight="600" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">独立环境</text>
  <text x="480" y="486" text-anchor="middle" fill="#99542E" font-size="22" font-weight="600" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">生成、部署、上线同一条数据链路</text>
