<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ZCode 与 CloudBase 连接器</title>
  <desc id="desc">自然语言驱动云开发的产品界面，背景补充 AI 指令、云资源和部署链路等业务属性。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20163D"/>
      <stop offset="1" stop-color="#5644A0"/>
    </linearGradient>
    <linearGradient id="code" x1="182" y1="140" x2="778" y2="412" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A89BFF"/>
      <stop offset="1" stop-color="#EEB4FF"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="805" cy="68" r="174" fill="#BFB5FF" fill-opacity="0.16"/>
  <circle cx="112" cy="480" r="180" fill="#F1B8FF" fill-opacity="0.1"/>

  <!-- 仅补充背景业务语义：AI 指令经过云资源后完成部署，不改变原有主体窗口。 -->
  <g opacity="0.24" stroke="#DDD6FF" fill="none" stroke-width="2">
    <path d="M48 170H114L139 195"/>
    <path d="M811 319H880L908 290"/>
    <path d="M823 100H900"/>
    <rect x="42" y="120" width="76" height="45" rx="8"/>
    <path d="M60 139H98M60 151H86" stroke-linecap="round"/>
    <path d="M872 112C872 98 884 88 898 88C912 88 923 98 923 112C923 126 912 136 898 136H872Z"/>
    <circle cx="874" cy="334" r="17"/>
    <circle cx="914" cy="294" r="17"/>
    <path d="M862 334H886M914 306V282" stroke-linecap="round"/>
  </g>
  <g opacity="0.22" fill="#EEE9FF">
    <circle cx="49" cy="195" r="5"/><circle cx="139" cy="195" r="5"/>
    <circle cx="811" cy="319" r="5"/><circle cx="908" cy="290" r="5"/>
  </g>

  <rect x="164" y="116" width="632" height="310" rx="18" fill="#161028" stroke="#BFB5FF" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="164" y="116" width="632" height="52" rx="18" fill="#312653"/>
  <rect x="164" y="151" width="632" height="17" fill="#312653"/>
  <circle cx="196" cy="142" r="7" fill="#A89BFF"/>
  <circle cx="218" cy="142" r="7" fill="#D6A9FF"/>
  <circle cx="240" cy="142" r="7" fill="#F4C2FF"/>
  <text x="278" y="149" fill="#FFF8FF" font-size="18" font-weight="600" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">ZCode · CloudBase Connector</text>
  <text x="202" y="224" fill="#A89BFF" font-size="22" font-family="monospace">&gt; 用自然语言创建应用后端</text>
  <rect x="202" y="250" width="322" height="20" rx="6" fill="#6655A8"/>
  <rect x="202" y="286" width="266" height="20" rx="6" fill="#514482"/>
  <rect x="202" y="322" width="368" height="20" rx="6" fill="#514482"/>
  <rect x="600" y="210" width="160" height="164" rx="14" fill="#2C234B"/>
  <circle cx="680" cy="262" r="31" fill="url(#code)"/>
  <path d="M670 262L678 270L694 252" stroke="#281B4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="680" y="324" text-anchor="middle" fill="#F4EFFF" font-size="18" font-weight="600" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">后端已就绪</text>
  <text x="480" y="486" text-anchor="middle" fill="#E9E3FF" font-size="22" font-weight="600" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">自然语言驱动云开发</text>
</svg>
