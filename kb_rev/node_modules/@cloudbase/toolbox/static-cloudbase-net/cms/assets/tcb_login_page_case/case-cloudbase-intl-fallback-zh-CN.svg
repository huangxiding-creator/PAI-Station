<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">使用 CloudBase 构建生产级应用</title>
  <desc id="desc">AI 指令通过 CloudBase 的数据库、身份认证、云函数、存储与托管服务，最终部署为生产级应用。</desc>
  <style>text { font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif; }</style>
  <defs>
    <linearGradient id="bg" x1="72" y1="36" x2="892" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071B3F"/>
      <stop offset="0.55" stop-color="#0A3579"/>
      <stop offset="1" stop-color="#006EFF"/>
    </linearGradient>
    <linearGradient id="panel" x1="164" y1="108" x2="794" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102E62" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#0A2554" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="button" x1="648" y1="332" x2="760" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00C2FF"/>
      <stop offset="1" stop-color="#4A7DFF"/>
    </linearGradient>
    <filter id="shadow" x="116" y="72" width="728" height="424" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#00112E" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="815" cy="50" r="210" fill="#42C7FF" fill-opacity="0.11"/>
  <circle cx="96" cy="492" r="205" fill="#6D7CFF" fill-opacity="0.12"/>
  <path d="M0 420C182 362 312 470 492 420C684 366 763 258 960 306V540H0V420Z" fill="#1687FF" fill-opacity="0.08"/>

  <g opacity="0.42" stroke="#70CFFF" stroke-width="2" fill="none">
    <path d="M46 142H106L134 170"/>
    <path d="M825 118H906"/>
    <path d="M836 396H904L928 370"/>
    <circle cx="46" cy="142" r="5" fill="#70CFFF" stroke="none"/>
    <circle cx="906" cy="118" r="5" fill="#70CFFF" stroke="none"/>
    <circle cx="928" cy="370" r="5" fill="#70CFFF" stroke="none"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="140" y="96" width="680" height="356" rx="22" fill="url(#panel)" stroke="#6DBBFF" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="140" y="96" width="680" height="58" rx="22" fill="#123B7A"/>
    <rect x="140" y="132" width="680" height="22" fill="#123B7A"/>
    <circle cx="174" cy="125" r="7" fill="#62CBFF"/>
    <circle cx="198" cy="125" r="7" fill="#5D8EFF"/>
    <circle cx="222" cy="125" r="7" fill="#8B79FF"/>
    <text x="254" y="132" fill="white" font-size="19" font-weight="600" font-family="Arial, Helvetica, sans-serif">CloudBase AI Builder</text>

    <rect x="174" y="180" width="612" height="70" rx="14" fill="#0A214B" stroke="#368DDF" stroke-opacity="0.7"/>
    <circle cx="207" cy="215" r="17" fill="#006EFF"/>
    <path d="M201 215H213M207 209V221" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <text x="238" y="210" fill="#82D6FF" font-size="13" font-weight="600" font-family="Arial, Helvetica, sans-serif">描述你的应用</text>
    <text x="238" y="232" fill="white" font-size="18" font-family="Arial, Helvetica, sans-serif">构建安全、可扩展的全栈应用</text>

    <path d="M206 276H754" stroke="#2A65A8" stroke-width="2" stroke-dasharray="5 8"/>

    <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
      <rect x="174" y="300" width="106" height="78" rx="13" fill="#113B72" stroke="#3C8EE6"/>
      <path d="M211 323C211 317.48 218.16 313 227 313C235.84 313 243 317.48 243 323V343C243 348.52 235.84 353 227 353C218.16 353 211 348.52 211 343V323Z" stroke="#77D5FF" stroke-width="2"/>
      <ellipse cx="227" cy="323" rx="16" ry="10" stroke="#77D5FF" stroke-width="2"/>
      <text x="227" y="369" fill="white" font-size="13">数据库</text>

      <rect x="294" y="300" width="106" height="78" rx="13" fill="#113B72" stroke="#3C8EE6"/>
      <path d="M347 313L363 320V332C363 342 356 349 347 353C338 349 331 342 331 332V320L347 313Z" stroke="#77D5FF" stroke-width="2"/>
      <path d="M340 332L345 337L355 326" stroke="#77D5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="347" y="369" fill="white" font-size="13">身份认证</text>

      <rect x="414" y="300" width="106" height="78" rx="13" fill="#113B72" stroke="#3C8EE6"/>
      <path d="M458 315L446 334H460L454 352L478 328H464L472 315H458Z" fill="#77D5FF"/>
      <text x="467" y="369" fill="white" font-size="13">云函数</text>

      <rect x="534" y="300" width="106" height="78" rx="13" fill="#113B72" stroke="#3C8EE6"/>
      <path d="M567 327C567 321.48 571.48 317 577 317H597C602.52 317 607 321.48 607 327V346C607 351.52 602.52 356 597 356H577C571.48 356 567 351.52 567 346V327Z" stroke="#77D5FF" stroke-width="2"/>
      <path d="M572 326H602" stroke="#77D5FF" stroke-width="2"/>
      <text x="587" y="369" fill="white" font-size="13">存储</text>

      <rect x="654" y="300" width="132" height="78" rx="13" fill="#113B72" stroke="#3C8EE6"/>
      <path d="M700 319H740V351H700V319Z" stroke="#77D5FF" stroke-width="2"/>
      <path d="M700 328H740M711 319V328" stroke="#77D5FF" stroke-width="2"/>
      <text x="720" y="369" fill="white" font-size="13">托管</text>
