    <rect x="614" y="398" width="172" height="36" rx="18" fill="url(#button)"/>
    <path d="M640 416L649 421L649 411L640 416Z" fill="white"/>
    <text x="664" y="421" fill="white" font-size="14" font-weight="600" font-family="Arial, Helvetica, sans-serif">部署至生产环境</text>
  </g>

  <text x="480" y="504" text-anchor="middle" fill="white" font-size="23" font-weight="600" font-family="Arial, Helvetica, sans-serif">从想法到生产，尽在 CloudBase</text>
</svg>
