<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kujiale Custom App Management</title>
  <desc id="desc">A product interface for managing Kujiale custom apps, supported by space planning and floor plan elements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#F8FBFF"/>
    </linearGradient>
    <linearGradient id="blue" x1="140" y1="156" x2="800" y2="442" gradientUnits="userSpaceOnUse">
      <stop stop-color="#146BFF"/>
      <stop offset="1" stop-color="#73ADFF"/>
    </linearGradient>
    <filter id="shadow" x="100" y="104" width="760" height="386" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2C67BD" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="812" cy="80" r="182" fill="#CDE1FF" fill-opacity="0.45"/>
  <circle cx="91" cy="479" r="160" fill="#DDEBFF" fill-opacity="0.8"/>

