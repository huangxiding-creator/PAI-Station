stages:
- stage: 安装依赖
  tasks:
  - task: 安装依赖
    cmds:
    - plugin: cmds
      params:
        cmds:
        - 'bash -lc ''

          set -e

          export NVM_DIR="$HOME/.nvm"

          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          nvm install 22.14.0

          nvm use 22.14.0

          node -v

          npm -v

          npm install

          '''
- stage: 创建发布分支
  tasks:
  - task: 创建发布分支
    cmds:
    - plugin: cmds
      params:
        cmds:
        - set -e
        - echo "🌿 基于 ${QCI_REPO_BRANCH} 创建发布分支 release/${MANAGER_NODE_VERSION}"
        - git config --global user.email "cloudbase-ci-bot@tencent.com"
        - git config --global user.name "cloudbase-ci-bot"
        - git fetch origin ${QCI_REPO_BRANCH}
        - git checkout -B release/${MANAGER_NODE_VERSION} origin/${QCI_REPO_BRANCH}
        - git push origin release/${MANAGER_NODE_VERSION} --force
        - echo "✅ 发布分支 release/${MANAGER_NODE_VERSION} 已创建并推送"
- stage: 更新版本号
  tasks:
  - task: 更新版本号
    cmds:
    - plugin: cmds
      params:
        cmds:
        - "bash -lc ' \nset -e \nexport NVM_DIR=\"$HOME/.nvm\"\n[ -s \"$NVM_DIR/nvm.sh\"\
          \ ] && . \"$NVM_DIR/nvm.sh\"\nnvm use 22.14.0\necho \"\U0001F4DD 更新 package.json\
          \ version -> ${MANAGER_NODE_VERSION}\"\n# 配置 git \ngit config --global user.email\
          \ \"cloudbase-ci-bot@tencent.com\"\ngit config --global user.name \"cloudbase-ci-bot\"\
          \n# 切换到 release 分支 \ngit fetch origin release/${MANAGER_NODE_VERSION} \n\
          git checkout release/${MANAGER_NODE_VERSION}\n# 更新版本号 \nnpm version ${MANAGER_NODE_VERSION}\
          \ --no-git-tag-version --allow-same-version\n# 提交版本号变更 \ngit add package.json\
          \ \ngit commit -m \"chore(release): bump version to ${MANAGER_NODE_VERSION}\"\
          \ || echo \"版本号无变更\" \ngit push origin release/${MANAGER_NODE_VERSION} \n\
          '"
- stage: Lint 检查
  tasks:
  - task: Lint 检查
    cmds:
    - plugin: cmds
      params:
        cmds:
        - npm run lint
- stage: 构建
  tasks:
  - task: 构建
    cmds:
    - plugin: cmds
      params:
        cmds:
        - npm run build
- stage: 产物检查
  tasks:
  - task: 产物检查
    cmds:
    - plugin: cmds
      params:
        cmds:
        - '# 脚本内容默认是单行命令执行。'
        - '    # 如需增加多行命令，请在开始和结束用"--"标识，例如：'
        - '    # --'
        - '    # if !(command -v unzip)'
        - '    # then'
        - '    #   yum install -y unzip'
        - '    # fi'
        - '    # --'
        - '    # sh hello.sh'
        - '# 检查构建产物是否存在'
        - "if [ ! -f \"lib/index.js\" ]; then\n  echo \"❌ 构建产物 lib/index.js 不存在\"\n\
          \  exit 1\nfi"
        - "if [ ! -f \"types/index.d.ts\" ]; then\n  echo \"❌ 类型声明文件 types/index.d.ts\
          \ 不存在\"\n  exit 1\nfi"
        - '# 输出当前版本号供后续阶段使用'
        - 'echo "当前发布版本: $(node -p "require(''./package.json'').version")"'
    artifacts:
    - ./lib/**
- prompt:
  - msg: 人工审批
    detail: '欢迎使用发布流水线，请确认以下信息：

      构建触发人: $QCI_TRIGGER

      分支: $QCI_REPO_BRANCH

      提交时间：${QCI_COMMIT_DATE}

      开发人员：${QCI_COMMIT_AUTHOR}

      提交信息：${QCI_COMMIT_MESSAGE}

      发布版本：${MANAGER_NODE_VERSION}

      请确认版本号和变更内容，审批通过后将会自动发布到 npmjs.com'
    timeout_status: 6
    env: {}
    to: nenneyu;lucyqzhang;royhyang
    if: $RELEASE_TYPE = latest
- stage: npm 发布
  tasks:
  - task: npm 发布
    cmds:
    - plugin: cmds
      params:
        cmds:
        - '# 设置 npm registry'
        - npm config set registry https://registry.npmjs.org
        - '# 使用凭据注入的 NPM_TOKEN 进行认证'
        - echo "//registry.npmjs.org/:_authToken=${YARN_NPM_AUTH_TOKEN}" > ~/.npmrc
        - npm whoami
        - cat ~/.npmrc
        - npm publish --access public --tag ${RELEASE_TYPE}
- stage: 生成并同步 changelog（docs）
  tasks:
  - task: 生成并同步 changelog
    cmds:
    - plugin: ci_changelog
      version: 1.1.0
      params:
        to_ref: HEAD
        tag_pattern: ^v(\d+\.\d+\.\d+(?:-[\w.]+)?)$
        enable_ai_summarize: true
        ai_model: hy3
        bilingual: true
        enable_docs_sync: true
        docs_base_branch: master
        docs_branch_prefix: docs/manager-node-changelog-v
        commit_message: 'docs(manager-node): sync changelog for v${version}'
        force_push: true
        output_zh_path: $QCI_WORKSPACE/changelog_content.md
        output_en_path: $QCI_WORKSPACE/changelog_content_en.md
        enable_repo_changelog: false
        repo_base_branch: master
        repo_branch_prefix: changelog/v
        repo_changelog_path: CHANGELOG.md
        repo_commit_message: 'docs: update CHANGELOG.md for v${version}'
        repo_force_push: true
        main_package_path: package.json
        ai_api_url: ${AI_API_URL}
        ai_api_key: ${AI_API_KEY}
        docs_repo: https://git.woa.com/QBase/cloudbase-docs.git
        zh_path: docs/api-reference/manager/node/changelog.md
        en_path: i18n/en/docusaurus-plugin-content-docs/current/api-reference/manager/node/changelog.md
        repo_repo: https://git.woa.com/QBase/server-side-sdk/cloudbase-manager-node.git
- stage: 生成changelog并打tag
  tasks:
  - task: 生成changelog并打tag
    cmds:
    - plugin: cmds
      params:
        cmds:
        - "bash -lc '\nset -e\nexport NVM_DIR=\"$HOME/.nvm\"\n[ -s \"$NVM_DIR/nvm.sh\"\
          \ ] && . \"$NVM_DIR/nvm.sh\"\nnvm use 22.14.0\necho \"==========================================\"\
          \necho \"\U0001F4E6 写回插件生成的 changelog 并打 tag v${MANAGER_NODE_VERSION}\"\n\
          echo \"==========================================\"\n# 配置 git\ngit config\
          \ --global user.email \"cloudbase-ci-bot@tencent.com\"\ngit config --global\
          \ user.name \"cloudbase-ci-bot\"\n# 切换到 release 分支\ngit fetch origin release/${MANAGER_NODE_VERSION}\n\
          git checkout release/${MANAGER_NODE_VERSION}\n# 1. 写回插件生成的 changelog（仅 latest\
          \ 版本）\necho \"\"\necho \"\U0001F4DD Step 1: 写回插件产物到 CHANGELOG.md\"\nif [\
          \ \"$RELEASE_TYPE\" = \"latest\" ]; then\n    if [ ! -f \"${QCI_WORKSPACE}/changelog_content.md\"\
          \ ]; then\n        echo \"❌ 插件产物 ${QCI_WORKSPACE}/changelog_content.md 不存在\"\
          \n        exit 1\n    fi\n    cat \"${QCI_WORKSPACE}/changelog_content.md\"\
          \ CHANGELOG.md > CHANGELOG.md.new\n    mv CHANGELOG.md.new CHANGELOG.md\n\
          \    # 2. 提交 changelog\n    echo \"\"\n    echo \"\U0001F4DD Step 2: 提交变更\"\
          \n    git add CHANGELOG.md\n    git commit -m \"docs(release): changelog\
          \ for v${MANAGER_NODE_VERSION}\" || echo \"没有需要提交的变更\"\nelse\n    echo \"\
          ⏭️  RELEASE_TYPE !== latest，跳过 CHANGELOG.md 写回\"\nfi\n# 3. 打 tag\necho \"\
          \"\necho \"\U0001F3F7️  Step 3: 创建 tag v${MANAGER_NODE_VERSION}\"\ngit tag\
          \ -a \"v${MANAGER_NODE_VERSION}\" -m \"Release v${MANAGER_NODE_VERSION}\"\
          \n# 4. 推送分支和 tag\necho \"\"\necho \"\U0001F680 Step 4: 推送到远程\"\ngit push\
          \ origin release/${MANAGER_NODE_VERSION}\ngit push origin \"v${MANAGER_NODE_VERSION}\"\
          \necho \"\"\necho \"✅ 完成！\"\necho \"   - changelog.md: 已更新\"\necho \"  \
          \ - tag: v${MANAGER_NODE_VERSION}\"\n'"
      label: 命令行脚本
- stage: 创建合并请求
  tasks:
  - task: 创建合并请求
    cmds:
    - plugin: cmds
      params:
        cmds:
        - 'if [[ ${RELEASE_TYPE} = "latest" ]]; then

          echo "🔀 合并 release/${MANAGER_NODE_VERSION} 到 master"

          # 配置 git（CI 机器人身份，使用 CI 内置 git 凭据）

          git config --global user.email "cloudbase-ci-bot@tencent.com"

          git config --global user.name "cloudbase-ci-bot"

          # 拉取最新 master 和 release 分支

          git fetch origin master

          git fetch origin release/${MANAGER_NODE_VERSION}

          # 切到 master 并合并 release 分支

          git checkout master

          git merge --no-ff origin/release/${MANAGER_NODE_VERSION} -m "chore(release):
          v${MANAGER_NODE_VERSION}"

          # 直接推送到 master（不走 MR）

          git push origin master

          echo "✅ 已合并并推送到 master"

          fi'
    if: $RELEASE_TYPE = latest
- stage: 企微群通知
  tasks:
  - task: 企微群通知
    cmds:
    - plugin: cmds
      params:
        cmds:
        - echo "📦 @cloudbase/manager-node v${MANAGER_NODE_VERSION} 发布成功" > ${QCI_WORKSPACE}/wework_message.md
        - echo "" >> ${QCI_WORKSPACE}/wework_message.md
        - cat ${QCI_WORKSPACE}/changelog_content.md >> ${QCI_WORKSPACE}/wework_message.md
        - cat ${QCI_WORKSPACE}/wework_message.md
    - plugin: message_wework_group
      params:
        c_type: text
        env_variable: _WEWORK_GROUP_ID
        mentioned: lucyqzhang;nenneyu
        content_path: ${QCI_WORKSPACE}/wework_message.md
        group_id: ww150005365489083
    if: $RELEASE_TYPE = latest
