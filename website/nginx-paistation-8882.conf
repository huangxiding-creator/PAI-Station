server {
    listen 8882;
    listen [::]:8882;
    server_name _;
    root /www/PAIStation;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff;
}
